name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    # One test spawns 200 agents and the runner's 5 s cap per test cannot be raised; the Linux runner needs longer.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: the mod API changes between releases. Bump it on purpose.
      - run: npm install -g @anthropic-ai/claude-code@2.1.330
      - run: claude plugin validate .
      - run: for p in plugins/*/; do claude plugin validate "$p" || exit 1; done
      - run: claude plugin test plugins/savvy-progress
